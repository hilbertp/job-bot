# jobbot configuration. Copy to data/config.yaml and edit.

score_threshold: 0            # 0-100; minimum score to include in digest
max_jobs_per_run: 200         # safety cap on LLM spend
salary_floor_eur_year: 0      # drop postings whose STATED top pay < this (EUR/yr); 0 disables
freelance_sources: []         # sources with hourly comp, exempt from the annual floor
freelance_hourly_floor_eur: 0 # min freelance rate EUR/hr for those sources; 0 disables
apply_research_enabled: false # web-search canonical apply URL for paywalled rows (adds LLM+search cost)
apply_research_max_per_run: 50 # cap researched rows/run when enabled
regenerate_existing_docs: false # false = reuse CV/CL already on disk (cheaper); true = always rebuild
output_dir: output            # relative to repo root

# Path to a pre-designed static CV PDF used for outgoing applications.
# When this file exists, the generator skips per-job CV tailoring and attaches
# this PDF as-is. Cover letters stay tailored. Set to empty / null to restore
# Markdown→HTML→PDF per-job tailoring.
cv_pdf_path: "data/general CV.pdf"

digest:
  generate_docs_above_score: 70
  max_per_email: 100

# Static GitHub Pages dashboard + local Downloads export (`jobbot publish`).
# The daily scheduled pass (`jobbot daily`) runs the pipeline and then this.
publish:
  enabled: true
  site_title: "Job Bot: Daily Matches"
  min_score: 60               # only rows scoring >= this appear on the site
  max_age_days: 45            # only rows first seen within this window
  posted_today_only: false    # true = show ONLY postings from the publish day (posted_at, else scrape day)
  max_jobs: 300               # hard cap, best score first
  # User site (https://<user>.github.io/): the <user>.github.io repo, branch main.
  # Project site (https://<user>.github.io/<repo>/): the code repo + pages_branch: gh-pages.
  pages_repo_url: ""          # clone URL; empty = build the site locally only
  pages_repo_dir: ""          # working copy for the publish commit; empty = ~/.jobbot/pages-repo
  pages_branch: main
  include_documents: true     # WARNING: the Pages site is public; false keeps PDFs off the web
  downloads_dir: ""           # empty = ~/Downloads/jobbot
  downloads_enabled: true

# Per-source settings. Each can be enabled/disabled, given specific search queries,
# and (separately) opted into auto-submit.
sources:
  weworkremotely:
    enabled: true
    auto_submit: false
    queries:
      - category: remote-programming-jobs
      - category: remote-devops-sysadmin-jobs

  freelancermap:
    enabled: true
    auto_submit: false
    queries:
      - keywords: [python, data, ml]
        remote: true
      - keywords: [product, owner, agile, scrum]
        remote: true

  freelance_de:
    enabled: true
    auto_submit: false
    queries:
      - keywords: [python, backend]
      - keywords: [product, owner, agile, scrum]

  indeed:
    enabled: true
    auto_submit: false        # Indeed Apply is risky to automate; keep off
    queries:
      - q: "python developer"
        l: "Berlin"
      - q: "data engineer"
        l: "remote"
      - q: "product owner"
        l: "Berlin"
      - q: "product owner"
        l: "remote"

  stepstone:
    enabled: true
    auto_submit: false
    queries:
      - q: "python"
        l: "Deutschland"
      - q: "product owner"
        l: "Deutschland"

  xing:
    enabled: true
    auto_submit: false
    queries:
      - q: "python developer"
      - q: "product owner"

  linkedin:
    enabled: true
    auto_submit: false        # LinkedIn ToS — keep off; assist only
    queries:
      - keywords: "python developer"
        location: "Germany"
      - keywords: "product owner"
        location: "Germany"

# Auto-apply behavior (used only for sources where auto_submit: true)
apply:
  dry_run: true               # take screenshot of filled form, don't click submit
  confirm_each: false         # if true, pause and wait for human OK before submit
  per_run_limit: 5            # max submissions per scheduled run
  screener_min_confidence: 0.8  # below this, queue for manual review

# OTP fetcher
otp:
  poll_interval_s: 5
  timeout_s: 120

# Captcha solver
captcha:
  timeout_s: 90
  max_retries: 2
